# Namespace: istio-ingress
# Managed by: argocd/platform/namespaces.yaml ApplicationSet (wave -3)
#
# Dedicated namespace for the Istio ingress gateway (data plane).
# Separated from istio-system to decouple gateway lifecycle from control plane.
#
# istio-injection MUST be enabled here — the gateway Deployment uses
# image: auto, which is substituted by the MutatingAdmissionWebhook
# registered by istiod at wave -1. Without injection, image: auto
# remains literal and the pod fails with ErrImagePull.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    istio-injection: enabled
    platform.podyourlife.io/domain: servicemesh
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted