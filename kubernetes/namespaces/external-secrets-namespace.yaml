# Namespace: external-secrets
# Managed by: argocd/platform/namespaces.yaml ApplicationSet (wave -3)
# Upstream convention — name imposed by the External Secrets Operator chart, do not rename.
#
# Istio injection enabled — ESO runs as long-lived Deployments only (controller,
# webhook, cert-controller). No Jobs or CronJobs that would block on sidecar termination.
#
# PodSecurity: restricted — ESO runs as non-root with read-only filesystem.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    platform.podyourlife.io/domain: secrets
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted