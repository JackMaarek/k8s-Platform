# Namespace: external-secrets
# Managed by: argocd/platform/namespaces.yaml ApplicationSet (wave -3)
# Upstream convention — name imposed by the External Secrets Operator chart, do not rename.
#
# Istio injection disabled — the istio-init container requires NET_ADMIN/NET_RAW
# capabilities and runAsUser=0, which violate PodSecurity restricted. ESO is an
# infra operator that does not serve mesh traffic, same pattern as monitoring/kyverno.
#
# PodSecurity: restricted — ESO runs as non-root with read-only filesystem.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    platform.podyourlife.io/domain: secrets
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted