# ml-namespace.yaml
# Namespace: ml
# Domain: machine learning batch workloads
# Managed by: argocd/platform/namespaces.yaml ApplicationSet (wave -3)
#
# Shared namespace for all ML batch workloads on the platform.
# Each workload is isolated by labels (app.kubernetes.io/instance: <project>)
# and by its own ServiceAccount + RBAC.
#
# Evolution path: if per-project isolation is required (separate teams,
# separate clients), create ml-<project> namespaces following this same
# template and update namespace.name in the project values file.
#
# Istio injection enabled — even if ML batch Jobs have near-zero inter-pod traffic.
# Zero trust is assured by IRSA (AWS API auth) + ESO (secret injection) +
# Kyverno registry allowlist (image provenance). Jobs also require clean
# Completed status — Envoy sidecar does not terminate when the main
# container exits, which would block the pod indefinitely.
apiVersion: v1
kind: Namespace
metadata:
  name: ml
  labels:
    platform.podyourlife.io/domain: ml
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted