# Namespace: kyverno
# Managed by: argocd/platform/namespaces.yaml ApplicationSet (wave -3)
# Upstream convention — name imposed by the Kyverno chart, do not rename.
#
# Istio injection disabled — Kyverno 3.x creates CronJobs for admission report
# cleanup (admissionReports, clusterAdmissionReports). A running Envoy sidecar
# prevents these pods from reaching Completed status, blocking future runs.
#
# PodSecurity: privileged — Kyverno admission controller requires elevated
# permissions to intercept and validate cluster-wide admission requests.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    platform.podyourlife.io/domain: policy
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted