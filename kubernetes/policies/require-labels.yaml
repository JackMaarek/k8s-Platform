# require-labels.yaml
# Requires app, env, and team labels on all Pods for observability and ownership.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-labels
  annotations:
    policies.kyverno.io/title: Require Pod Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      All Pods must have 'app', 'env', and 'team' labels for consistent
      observability, policy targeting, and ownership tracking.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-app-env-team-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - istio-system
            - istio-ingress
            - cert-manager
            - argocd
            - kyverno
            - monitoring
            - finops
            - external-secrets
      validate:
        message: "Pods must have 'app', 'env', and 'team' labels."
        pattern:
          metadata:
            labels:
              app: "?*"
              env: "?*"
              team: "?*"
