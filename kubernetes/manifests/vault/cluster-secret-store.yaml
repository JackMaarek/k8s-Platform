# ClusterSecretStore — ESO backend pointing to Vault dev mode.
#
# Token-based auth for Kind (dev). The root token "root" is stored in a
# Kubernetes Secret created by the bootstrap script.
# On EKS, this file is replaced by an AWS Secrets Manager provider
# with IRSA auth — injected by platform-bot env add.
#
# ClusterSecretStore (not SecretStore) so that ExternalSecrets in any
# namespace can reference it without per-namespace SecretStore duplication.
#
# Ref: https://external-secrets.io/latest/provider/hashicorp-vault/
---
# Secret containing the Vault root token for ESO authentication.
# Created inline here for simplicity — on EKS this is not needed (IRSA).
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: external-secrets
type: Opaque
stringData:
  token: "root"

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"
          namespace: "external-secrets"
