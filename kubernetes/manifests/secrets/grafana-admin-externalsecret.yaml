# grafana-admin-externalsecret.yaml
# ExternalSecret for Grafana admin credentials — sourced from AWS Secrets Manager.
# ESO creates the grafana-admin-credentials Secret in monitoring namespace.
# Grafana references it via existingSecret in grafana-values.yaml.
#
# AWS SM key: platform/{env}/grafana-admin
# Required properties: admin-user, admin-password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/__ENV__/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/__ENV__/grafana-admin
        property: admin-password
