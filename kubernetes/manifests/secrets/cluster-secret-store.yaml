# ClusterSecretStore — AWS Secrets Manager backend for staging/prod
# Hydrated by platform-bot env setup — __AWS_REGION__ resolved at branch creation
# The name MUST remain "aws-secrets-manager" — all ExternalSecrets reference this name
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: __AWS_REGION__
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
