# ClusterIssuers for TLS certificate provisioning.
#
# Dev environment (Kind): selfsigned-issuer only.
# Generates self-signed certificates with no external dependency.
# Browsers will show a security warning — acceptable for local dev.
#
# EKS environments (staging/prod): letsencrypt-staging or letsencrypt-prod
# are injected by platform-bot env add <env> during branch hydration.
# They are NOT included here — dev has no public domain or internet-facing
# gateway for ACME HTTP-01 challenge validation.
#
# Usage in a Certificate resource:
#   issuerRef:
#     name: selfsigned-issuer
#     kind: ClusterIssuer
#
# Ref: https://cert-manager.io/docs/configuration/
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
