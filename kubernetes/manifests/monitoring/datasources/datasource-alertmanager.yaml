# datasource-alertmanager.yaml
# Declares the Alertmanager datasource in Grafana.
#
# Hot-loaded automatically by the k8s-sidecar via label grafana_datasource=1.
# handleGrafanaManagedAlerts: false — Grafana reads from Alertmanager only,
# it does not write back. Used to display silences and active alerts in dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-alertmanager
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  alertmanager.yaml: |
    apiVersion: 1
    datasources:
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        access: proxy
        url: http://prometheus-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
        isDefault: false
        jsonData:
          handleGrafanaManagedAlerts: false
          implementation: prometheus
