# datasource-prometheus.yaml
# Declares the Prometheus datasource in Grafana.
#
# Hot-loaded automatically by the k8s-sidecar via label grafana_datasource=1.
# Fixed uid "prometheus" — dashboards reference datasources by uid, not name.
# isDefault: true — selected by default in new panels.
#
# Note: grafana-values.yaml disables the chart-native datasource ConfigMap
# (sidecar.datasources.defaultDatasourceEnabled: false) so that this
# ConfigMap is the single source of truth for the Prometheus datasource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
