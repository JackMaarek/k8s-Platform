# datasource-prometheus.yaml
# Responsabilité : déclarer la datasource Prometheus dans Grafana.
#
# Chargé automatiquement par le sidecar k8s-sidecar via le label grafana_datasource=1.
# uid fixe "prometheus" — les dashboards référencent les datasources par uid.
# isDefault: true — datasource sélectionnée par défaut dans les nouveaux panels.
#
# Note : grafana-values.yaml désactive la ConfigMap native du chart
# (sidecar.datasources.defaultDatasourceEnabled: false) pour que cette
# ConfigMap soit la seule source de vérité pour la datasource Prometheus.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
