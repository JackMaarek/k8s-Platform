# datasource-loki.yaml
# Declares the Loki datasource in Grafana.
#
# Hot-loaded automatically by the k8s-sidecar via label grafana_datasource=1.
# Depends on: loki ApplicationSet (wave 5) must be Running before wave 7 syncs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
