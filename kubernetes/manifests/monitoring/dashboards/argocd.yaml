# ConfigMap — ArgoCD — Detail
# Chargé automatiquement par le sidecar k8s-sidecar via grafana_dashboard=1.
# Dossier Grafana : Platform
# UID du dashboard : argocd-detail
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-argocd-detail
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "/tmp/dashboards/Platform"
data:
  argocd-detail.json: |
    {
      "title": "ArgoCD \u2014 Detail",
      "uid": "argocd-detail",
      "description": "Drill-down ArgoCD : \u00e9tat des applications, performance du controller et du repo-server",
      "editable": true,
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "tags": [
        "platform",
        "argocd"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "hide": 0
          },
          {
            "name": "project",
            "type": "query",
            "datasource": "$datasource",
            "query": "label_values(argocd_app_info, project)",
            "label": "Project",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Healthy",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(argocd_app_info{health_status=\"Healthy\", project=~\"$project\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 2,
          "title": "Degraded",
          "type": "stat",
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(argocd_app_info{health_status=~\"Degraded|Missing|Unknown\", project=~\"$project\"}) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 3,
          "title": "Progressing",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(argocd_app_info{health_status=\"Progressing\", project=~\"$project\"}) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 4,
          "title": "OutOfSync",
          "type": "stat",
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(argocd_app_info{sync_status=\"OutOfSync\", project=~\"$project\"}) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 5,
          "title": "Sync Failures (1h)",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(increase(argocd_app_sync_total{phase=\"Failed\", project=~\"$project\"}[1h])) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 6,
          "title": "Reconcile Queue Depth",
          "type": "stat",
          "gridPos": {
            "x": 15,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "workqueue_depth{name=\"app_reconciliation_queue\"} or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 7,
          "title": "Git Request Rate",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(rate(argocd_git_request_total[5m]))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 8,
          "title": "Applications \u2014 \u00c9tat",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 14,
            "h": 9
          },
          "options": {
            "sortBy": [
              {
                "displayName": "Health",
                "desc": false
              }
            ],
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Health"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Healthy": {
                            "text": "\u25cf Healthy",
                            "color": "green"
                          }
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Degraded": {
                            "text": "\u25cf Degraded",
                            "color": "red"
                          }
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Progressing": {
                            "text": "\u25cf Progressing",
                            "color": "blue"
                          }
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Missing": {
                            "text": "\u25cf Missing",
                            "color": "orange"
                          }
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Unknown": {
                            "text": "\u25cf Unknown",
                            "color": "gray"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.displayMode",
                    "value": "color-text"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Sync"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Synced": {
                            "text": "\u2713 Synced",
                            "color": "green"
                          }
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "OutOfSync": {
                            "text": "\u26a0 OutOfSync",
                            "color": "orange"
                          }
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Unknown": {
                            "text": "? Unknown",
                            "color": "gray"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.displayMode",
                    "value": "color-text"
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "argocd_app_info{project=~\"$project\"}",
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "name",
                    "project",
                    "health_status",
                    "sync_status",
                    "dest_namespace",
                    "repo"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "name": "Application",
                  "project": "Project",
                  "health_status": "Health",
                  "sync_status": "Sync",
                  "dest_namespace": "Namespace",
                  "repo": "Repo"
                }
              }
            }
          ]
        },
        {
          "id": 9,
          "title": "Sync Rate par phase",
          "type": "timeseries",
          "gridPos": {
            "x": 14,
            "y": 3,
            "w": 10,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Succeeded"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum by (phase) (rate(argocd_app_sync_total{project=~\"$project\"}[5m]))",
              "legendFormat": "{{phase}}"
            }
          ]
        },
        {
          "id": 10,
          "title": "Reconciliation Duration p95",
          "type": "timeseries",
          "gridPos": {
            "x": 14,
            "y": 7,
            "w": 10,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(argocd_app_reconcile_bucket[5m])))",
              "legendFormat": "p95"
            },
            {
              "datasource": "$datasource",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(argocd_app_reconcile_bucket[5m])))",
              "legendFormat": "p50"
            }
          ]
        }
      ]
    }
