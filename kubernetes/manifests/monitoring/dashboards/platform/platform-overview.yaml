# ConfigMap — Platform Overview
# Loaded automatically by the k8s-sidecar via grafana_dashboard=1.
# Grafana folder: Platform
# Dashboard UID: argocd-detail
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "Platform"
data:
  platform-overview.json: |
    {
      "title": "Platform Overview",
      "uid": "platform-overview",
      "description": "\u00c9tat de sant\u00e9 global de la plateforme PodYourLife \u2014 ArgoCD, Istio, Monitoring, Kyverno, Cluster",
      "editable": true,
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "platform",
        "overview"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "hide": 0,
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          },
          {
            "name": "loki_datasource",
            "type": "datasource",
            "query": "loki",
            "label": "Loki",
            "hide": 0,
            "current": {
              "text": "Loki",
              "value": "loki"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "options": {
            "mode": "markdown",
            "content": "## \ud83d\ude80 ArgoCD \u2014 GitOps Pipeline"
          }
        },
        {
          "id": 2,
          "title": "Apps Healthy",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "text": {
              "valueSize": 32
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(argocd_app_info{health_status=\"Healthy\"})",
              "legendFormat": "Healthy"
            }
          ]
        },
        {
          "id": 3,
          "title": "Apps Degraded",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(argocd_app_info{health_status=~\"Degraded|Missing|Unknown\"}) or vector(0)",
              "legendFormat": "Degraded"
            }
          ]
        },
        {
          "id": 4,
          "title": "Out of Sync",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(argocd_app_info{sync_status=\"OutOfSync\"}) or vector(0)",
              "legendFormat": "OutOfSync"
            }
          ]
        },
        {
          "id": 5,
          "title": "Sync History (1h)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 4
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "success"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "success",
              "datasource": "$datasource",
              "expr": "sum(increase(argocd_app_sync_total{phase=\"Succeeded\"}[5m]))",
              "legendFormat": "Succeeded"
            },
            {
              "refId": "failed",
              "datasource": "$datasource",
              "expr": "sum(increase(argocd_app_sync_total{phase=\"Failed\"}[5m]))",
              "legendFormat": "Failed"
            }
          ]
        },
        {
          "id": 10,
          "type": "text",
          "title": "",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "options": {
            "mode": "markdown",
            "content": "## \ud83d\udd78\ufe0f Istio \u2014 Service Mesh"
          }
        },
        {
          "id": 11,
          "title": "Request Success Rate",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(rate(istio_requests_total{response_code!~\"5.*\"}[5m])) / sum(rate(istio_requests_total[5m]))",
              "legendFormat": "Success rate"
            }
          ]
        },
        {
          "id": 12,
          "title": "P99 Latency",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 6,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 200
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket[5m])) by (le)) * 1000",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 13,
          "title": "Request Rate (RPS)",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 6,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
