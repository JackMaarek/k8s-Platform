            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum(rate(istio_requests_total[5m]))",
              "legendFormat": "RPS"
            }
          ]
        },
        {
          "id": 14,
          "title": "Traffic by Namespace",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 4
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          },
          "targets": [
            {
              "datasource": "$datasource",
              "expr": "sum by (destination_service_namespace) (rate(istio_requests_total[5m]))",
              "legendFormat": "{{destination_service_namespace}}"
            }
          ]
        },
        {
          "id": 20,
          "type": "text",
          "title": "",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 24,
            "h": 1
          },
          "options": {
            "mode": "markdown",
            "content": "## \ud83d\udcca Monitoring Stack \u2014 Prometheus \u00b7 Loki \u00b7 Alertmanager"
