# grafana-values.yaml
# Chart: prometheus-community/kube-prometheus-stack (subchart grafana)
#
# Scope: visualisation — full Grafana configuration.
# Contains: Grafana, dashboard sidecar, persistence, resources.
# Does NOT contain: datasources → see kubernetes/manifests/monitoring/datasources/
#
# ── Datasources ───────────────────────────────────────────────────────────────
# Datasources are declared exclusively in:
#   kubernetes/manifests/monitoring/datasources/
#   One file per datasource, each is a ConfigMap with label grafana_datasource=1.
#   The k8s-sidecar hot-loads them without restarting Grafana.
#
# The chart-generated native datasource ConfigMap is disabled via
# defaultDatasourceEnabled: false to avoid duplicates.
#
# ── Dashboards ────────────────────────────────────────────────────────────────
# Dashboards are declared in:
#   kubernetes/manifests/monitoring/dashboards/
#   One file per dashboard group, ConfigMap with label grafana_dashboard=1.
#   The sidecar hot-loads them and organises them into folders via the
#   k8s-sidecar-target-directory annotation.
#
# ── Admin credentials ─────────────────────────────────────────────────────────
# Injected from the grafana-admin-credentials Secret created at bootstrap.
# Never store credentials in this file.

grafana:
  defaultDashboardsEnabled: true
  defaultDashboardsFolder: Infrastructure
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # initChownData requires root — disabled to comply with PodSecurity restricted.
  initChownData:
    enabled: false
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      # Disable the chart-generated datasource ConfigMap.
      # All datasources are declared in manifests/monitoring/datasources/ — single source of truth.
      defaultDatasourceEnabled: false
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  service:
    type: ClusterIP
    port: 80
