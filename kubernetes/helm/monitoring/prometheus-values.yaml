# prometheus-values.yaml
# Chart: prometheus-community/kube-prometheus-stack
#
# Scope: metrics collection and storage.
# Contains: PrometheusOperator, Prometheus, Alertmanager, exporters, alert rules.
# Does NOT contain: Grafana configuration → see grafana-values.yaml

prometheusOperator:
  enabled: true
  # Admission webhook Jobs must terminate cleanly.
  # An Istio sidecar blocks termination — Envoy never stops on its own.
  admissionWebhooks:
    patch:
      podAnnotations:
        sidecar.istio.io/inject: "false"
    createSecretJob:
      podAnnotations:
        sidecar.istio.io/inject: "false"
    patchWebhookJob:
      podAnnotations:
        sidecar.istio.io/inject: "false"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    # __CLUSTER_NAME__ is replaced by platform-bot at init time.
    # This label is injected on all metrics for multi-cluster Grafana views.
    externalLabels:
      cluster: __CLUSTER_NAME__
    # Auto-discovers ServiceMonitors and PodMonitors across all namespaces.
    # Each component declares its own ServiceMonitor — no central list here.
    namespaceSelector:
      any: true
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    retentionSize: "10GB"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
  ingress:
    enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

kubeApiServer:
  enabled: true
kubelet:
  enabled: true
  namespace: kube-system
kubeControllerManager:
  enabled: true
coreDns:
  enabled: true
kubeEtcd:
  enabled: true
kubeScheduler:
  enabled: true
kubeProxy:
  enabled: true
