# serviceaccount.yaml
# Dedicated ServiceAccount for this ML workload.
#
# A dedicated SA per project enforces least-privilege isolation — only this
# workload's pods carry the IRSA annotation. Other pods in the ml namespace
# are unaffected even if they share the namespace.
#
# IRSA (IAM Roles for Service Accounts):
#   When serviceAccount.irsaRoleArn is set, the EKS OIDC provider binds the
#   pod identity to the specified IAM Role. The pod can then call AWS APIs
#   (S3 GetObject, PutObject) without static credentials in the container.
#   The Role ARN is provisioned by terraform/domains/platform and injected
#   at deploy time by platform-bot (phase 6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ml-batch-job.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ml-batch-job.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.irsaRoleArn }}
  annotations:
    # IRSA annotation — EKS OIDC provider uses this to assume the IAM Role.
    # The role must have a trust policy allowing this ServiceAccount as principal.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.irsaRoleArn | quote }}
  {{- end }}
