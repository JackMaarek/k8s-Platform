---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ml-batch-job.cpuJobName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ml-batch-job.labels" . | nindent 4 }}
    ml-platform/job-type: cpu-train
    ml-platform/run-id: {{ .Values.job.runId | quote }}
spec:
  backoffLimit: {{ .Values.cpu.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.cpu.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ml-batch-job.selectorLabels" . | nindent 8 }}
        ml-platform/job-type: cpu-train
        ml-platform/run-id: {{ .Values.job.runId | quote }}
      annotations:
        # Disable Istio sidecar injection — see job-gpu.yaml for rationale.
        sidecar.istio.io/inject: "false"
        {{- if .Values.metrics.enabled }}
        # Prometheus scrape annotations — used as fallback if ServiceMonitor
        # is not available. ServiceMonitor takes precedence when enabled.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ml-batch-job.serviceAccountName" . }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.secretName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.cpu.nodeSelector | nindent 8 }}
      {{- if .Values.cpu.tolerations }}
      tolerations:
        {{- toYaml .Values.cpu.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: cpu-train
          image: "{{ .Values.image.cpu.repository }}:{{ .Values.image.cpu.tag }}"
          imagePullPolicy: {{ .Values.image.cpu.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.cpu.args }}
          args:
            {{- toYaml .Values.cpu.args | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "ml-batch-job.fullname" . }}-config
          resources:
            {{- toYaml .Values.cpu.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.persistentVolumes }}
            - name: {{ .name }}
              mountPath: /{{ .name }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        # Prometheus metrics sidecar — exposes training metrics on /metrics.
        # Shares the same PVCs as the main container to read training state
        # (loss, accuracy, epoch progress) written by the main process.
        - name: metrics-exporter
          image: {{ include "ml-batch-job.metricsImage" . }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.metricsPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.persistentVolumes }}
            - name: {{ .name }}
              mountPath: /{{ .name }}
            {{- end }}
        {{- end }}
      volumes:
        {{- range .Values.persistentVolumes }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ include "ml-batch-job.fullname" $ }}-{{ .name }}
        {{- end }}
