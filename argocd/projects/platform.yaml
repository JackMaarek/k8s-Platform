# AppProject: platform
# Scope: all infrastructure — Istio, monitoring, sealed-secrets, namespaces
# Allowed destinations: istio-system, istio-ingress, monitoring, argocd, kube-system
# Cluster-scoped resources allowed (CRDs, ClusterRoles, Namespaces)
# Only platform-admin role can sync — dev-team has read-only access
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Platform infrastructure — Istio, monitoring, ESO, namespaces"

  sourceRepos:
    - https://github.com/PodYourLife/k8s-platform.git
    - https://istio-release.storage.googleapis.com/charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://charts.bitnami.com/bitnami
    - https://helm.releases.hashicorp.com
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno/
    - https://opencost.github.io/opencost-helm-chart

  destinations:
    - namespace: istio-system
      server: https://kubernetes.default.svc
    - namespace: istio-ingress
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: development
      server: https://kubernetes.default.svc
    - namespace: staging
      server: https://kubernetes.default.svc
    - namespace: production
      server: https://kubernetes.default.svc
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: finops
      server: https://kubernetes.default.svc

  # Wildcard — platform manages cluster-wide resources: Namespaces, CRDs,
  # ClusterRoles, ClusterPolicies (Kyverno), WebhookConfigurations (Istio), etc.
  # Restricting to an explicit list has caused sync failures in the past.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Orphan resources allowed — Helm sometimes leaves behind CRDs on uninstall
  orphanedResources:
    warn: true

  roles:
    - name: platform-admin
      description: "Full sync access to platform apps"
      policies:
        - p, proj:platform:platform-admin, applications, *, platform/*, allow
        - p, proj:platform:platform-admin, repositories, *, *, allow
      groups:
        - platform-team
    - name: platform-readonly
      description: "Read-only access for dev-team"
      policies:
        - p, proj:platform:platform-readonly, applications, get, platform/*, allow
      groups:
        - dev-team