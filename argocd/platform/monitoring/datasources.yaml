# argocd/platform/monitoring/datasources.yaml
# Responsabilité : déployer les ConfigMaps de datasources Grafana.
# Chaque ConfigMap dans kubernetes/manifests/monitoring/datasources/ déclare
# une datasource unique — le sidecar k8s-sidecar les hot-load dans Grafana.
#
# Wave 7 — après prometheus (wave 4) : Grafana doit être Running avant
# que le sidecar puisse recharger les datasources.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-datasources
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'grafana-datasources-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/monitoring/datasources
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
