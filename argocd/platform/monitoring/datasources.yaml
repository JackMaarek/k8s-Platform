# argocd/platform/monitoring/datasources.yaml
# Responsabilité : déployer les ConfigMaps de datasources Grafana.
# Chaque ConfigMap dans kubernetes/manifests/monitoring/datasources/ déclare
# une datasource unique — le sidecar k8s-sidecar les hot-load dans Grafana.
#
# Wave 7 — après prometheus (wave 4) : Grafana doit être Running avant
# que le sidecar puisse recharger les datasources.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-datasources
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: dev
            targetRevision: dev
            awsRegion: eu-west-3
            esoIrsaRoleArn: ""
  template:
    metadata:
      name: 'grafana-datasources-dev'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: platform
      source:
        repoURL: https://github.com/PodYourLife/k8s-platform.git
        targetRevision: 'dev'
        path: kubernetes/manifests/monitoring/datasources
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
