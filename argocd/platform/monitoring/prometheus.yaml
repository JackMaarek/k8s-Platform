# argocd/platform/monitoring/prometheus.yaml
# Deploys the metrics collection stack.
# Installs: PrometheusOperator, Prometheus, Alertmanager, node-exporter, kube-state-metrics.
#
# Values split by responsibility (SRP):
#   prometheus-values.yaml → collection (Prometheus, Alertmanager, exporters, alert rules)
#   grafana-values.yaml    → visualisation (Grafana subchart, sidecar, persistence)
#
# Wave 4 — after namespaces (wave -3) and Istio (waves 0-3).
# The monitoring namespace must have istio-injection: disabled before this sync —
# admission webhook Jobs cannot terminate cleanly with an Istio sidecar running.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: dev
            targetRevision: dev
            awsRegion: eu-west-3
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: git@github.com:PodYourLife/k8s-Platform.git
  template:
    metadata:
      name: 'prometheus-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "8"
    spec:
      project: platform
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 82.4.2
          helm:
            releaseName: prometheus
            valueFiles:
              - $values/kubernetes/helm/monitoring/prometheus-values.yaml
              - $values/kubernetes/helm/monitoring/grafana-values.yaml
        - repoURL: '{{.repoUrl}}'
          targetRevision: '{{.targetRevision}}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
