# argocd/platform/monitoring/prometheus.yaml
# Responsabilité : déployer la stack de collecte de métriques.
# Installe : PrometheusOperator, Prometheus, Alertmanager, node-exporter, kube-state-metrics.
#
# Values splitées par responsabilité (SRP) :
#   prometheus-values.yaml → collecte (Prometheus, Alertmanager, exporters, règles)
#   grafana-values.yaml    → visualisation (Grafana subchart, sidecar, persistence)
#
# Wave 4 — après namespaces (wave -3) et Istio (waves 0-3).
# Le namespace monitoring doit avoir istio-injection: disabled avant ce sync
# (les Jobs admission webhook ne peuvent pas terminer avec un sidecar Istio).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
  template:
    metadata:
      name: 'prometheus-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "8"
    spec:
      project: platform
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 82.4.2
          helm:
            releaseName: prometheus
            valueFiles:
              - $values/kubernetes/helm/monitoring/prometheus-values.yaml
              - $values/kubernetes/helm/monitoring/grafana-values.yaml
        - repoURL: https://github.com/PodYourLife/k8s-platform.git
          targetRevision: '{{.targetRevision}}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
