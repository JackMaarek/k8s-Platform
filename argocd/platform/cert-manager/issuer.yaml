# Deploys ClusterIssuer resources for cert-manager.
# Wave 16 — cert-manager CRDs must exist (wave 15) before ClusterIssuers can sync.
#
# Contains:
#   - selfsigned-issuer: immediate TLS for Kind (local dev)
#   - letsencrypt-staging: ACME HTTP-01 for EKS (placeholder)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-issuers
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: dev
            targetRevision: dev
            awsRegion: eu-west-3
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: git@github.com:PodYourLife/k8s-Platform.git
  template:
    metadata:
      name: 'cert-manager-issuers-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "16"
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/cert-manager
      destination:
        server: https://kubernetes.default.svc
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
