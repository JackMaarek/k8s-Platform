# Deploys the ClusterSecretStore that connects ESO to Vault.
# Wave 18 — Vault must be running (wave 17) before ESO can connect to it.
#
# On EKS, this ApplicationSet points to a different path containing
# the AWS Secrets Manager ClusterSecretStore (no Vault needed).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vault-secret-store
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: dev
            targetRevision: dev
            awsRegion: eu-west-3
            esoIrsaRoleArn: ""
  template:
    metadata:
      name: 'vault-secret-store-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: platform
      source:
        repoURL: https://github.com/PodYourLife/k8s-platform.git
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/vault
      destination:
        server: https://kubernetes.default.svc
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
