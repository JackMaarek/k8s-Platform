# Kyverno policy engine — validates and mutates resources against ClusterPolicies
# Wave -1 — after namespaces (wave -3), before application workloads
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.4.1
    helm:
      releaseName: kyverno
      values: |
        # bitnami/kubectl is no longer published on docker.io for recent tags.
        # Override all cleanup job images to use the official Kyverno CLI image
        # from ghcr.io which is guaranteed to exist for each Kyverno release.
        cleanupJobs:
          admissionReports:
            image:
              registry: ghcr.io
              repository: kyverno/kyverno-cli
              tag: v1.13.4
          clusterAdmissionReports:
            image:
              registry: ghcr.io
              repository: kyverno/kyverno-cli
              tag: v1.13.4
        # policyReportsCleanup is a Helm post-upgrade hook — separate from cleanupJobs
        policyReportsCleanup:
          image:
            registry: ghcr.io
            repository: kyverno/kyverno-cli
            tag: v1.13.4
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
