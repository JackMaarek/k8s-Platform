# Installs the Istio ingress gateway
# Entry point for all external traffic into the mesh
# Depends on: istiod
#
# Default service type: LoadBalancer
# EKS: cloud NLB provisioned automatically via AWS Load Balancer Controller
# Kind: NodePort mapped to host port 80/443 via Kind cluster config
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform

  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.27.1
    helm:
      releaseName: istio-ingressgateway
      values: |
        # Disable sidecar injection — the gateway is itself an Envoy proxy.
        # Injecting a second proxy would create a circular dependency and
        # result in a container with image "auto" that cannot be resolved.
        podAnnotations:
          sidecar.istio.io/inject: "false"

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
