# Installs Istio base CRDs and cluster-wide resources
# Must sync before istiod — istiod depends on these CRDs
# Chart: https://istio-release.storage.googleapis.com/charts
# Version: 1.27.1 — resolved by platform-bot env hydrate from platform.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # base must be synced before istiod
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform

  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.27.1
    helm:
      releaseName: istio-base

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true


  # Both Istio validators drift their failurePolicy at runtime (Fail → Ignore)
  # ArgoCD would otherwise report OutOfSync on every reconcile loop
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jsonPointers:
        - /webhooks/0/failurePolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jsonPointers:
        - /webhooks/0/failurePolicy