# Installs the Istio control plane (istiod)
# istiod manages sidecar injection, mTLS certificates, and traffic policy
# Depends on: istio-base (CRDs) at wave -2
#
# Wave -1: istiod must be healthy before CNI (wave 0-1) and gateway (wave 2).
# The MutatingAdmissionWebhook registered by istiod is required for
# gateway pod injection (image: auto substitution).
#
# Version: 1.27.1 — resolved by platform-bot env hydrate from platform.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/0/failurePolicy
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: istio-sidecar-injector
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.27.1
    helm:
      releaseName: istiod
      values: |
        pilot:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Enable Prometheus metrics scraping on all proxies
        meshConfig:
          defaultConfig:
            proxyStatsMatcher:
              # Expose all Envoy stats to Prometheus
              inclusionRegexps:
                - ".*"
          defaultProviders:
            metrics:
              - prometheus
          # Merge Envoy stats into the app pod's /metrics endpoint
          enablePrometheusMerge: true
        # Resolve 'auto' proxy image for gateway injection on Kind.
        # Without global.hub/tag, the gateway template cannot resolve
        # the proxy image at runtime when no registry mirror is configured.
        global:
          hub: docker.io/istio
          tag: 1.27.1

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
