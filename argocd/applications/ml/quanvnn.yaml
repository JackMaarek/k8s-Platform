# quanvnn.yaml
# ArgoCD Application — QuanvNN ML batch pipeline, dev environment.
#
# Points to the generic ml-batch-job Helm chart with QuanvNN-specific values.
# To onboard a new ML project: copy this file, update name/values path/namespace.
#
# Run trigger: increment job.runId in quanvnn-dev.yaml and commit.
# ArgoCD detects the change, syncs, and Kubernetes creates the new Job.
#
# Cost: GPU node scales to zero when no Job is running.
# The ml namespace, PVCs, SA, and ConfigMap persist between runs at near-zero cost.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quanvnn-__ENV__
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: quanvnn
    app.kubernetes.io/part-of: ml-platform
    environment: __ENV__
spec:
  project: ml

  sources:
    # Generic ml-batch-job chart — shared across all ML batch projects.
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      path: kubernetes/helm/ml-batch-job
      helm:
        releaseName: quanvnn
        valueFiles:
          # Chart defaults — always loaded first.
          - values.yaml
          # QuanvNN dev overrides — loaded second, takes precedence.
          - $values/kubernetes/helm/values/quanvnn-__ENV__.yaml

    # Values reference source — required for the $values alias above.
    - repoURL: __REPO_URL__
      targetRevision: __TARGET_REVISION__
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: ml

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  # Completed Jobs are intentionally retained for log inspection.
  # ArgoCD health check ignores Completed Jobs — not treated as degraded.
  # Pod controller-uid label is set by kubelet at runtime — must be ignored.
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers:
        - /status
    - group: ""
      kind: Pod
      jsonPointers:
        - /metadata/labels/controller-uid
        - /metadata/labels/batch.kubernetes.io~1controller-uid

  revisionHistoryLimit: 5
