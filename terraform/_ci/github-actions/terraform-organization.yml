# terraform-organization.yml
# CI pipeline for domains/organization — IAM Identity Center bootstrap.
#
# This root runs once and covers all account assignments (dev, staging, prod).
# It is deployed from the dev branch — no per-env matrix needed.
#
# Trigger model:
#   push on dev → plan + apply
#   pull_request targeting dev → plan + comment on PR

name: terraform · domains/organization

on:
  push:
    branches: [dev]
    paths:
      - "terraform/domains/organization/**"
      - "terraform/_core/modules/aws/identity-center-bootstrap/**"
      - "terraform/_core/modules/aws/identity-center-assignment/**"
  pull_request:
    branches: [dev]
    paths:
      - "terraform/domains/organization/**"
      - "terraform/_core/modules/aws/identity-center-bootstrap/**"
      - "terraform/_core/modules/aws/identity-center-assignment/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-west-3"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/domains/organization/

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.60.0

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: |
          tflint --config $GITHUB_WORKSPACE/terraform/_ci/.tflint.hcl \
                 --chdir terraform/domains/organization

  plan:
    name: plan · organization
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform/domains/organization
        run: terraform init -no-color

      - name: terraform validate
        working-directory: terraform/domains/organization
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        working-directory: terraform/domains/organization
        run: terraform plan -no-color -out=tfplan

      - name: post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### terraform plan · domains/organization
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply:
    name: apply · organization
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push'
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform/domains/organization
        run: terraform init -no-color

      - name: terraform apply
        working-directory: terraform/domains/organization
        run: terraform apply -auto-approve -no-color
