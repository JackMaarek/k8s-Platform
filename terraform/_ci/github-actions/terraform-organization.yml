# terraform-organization.yml
# CI pipeline for domains/organization — IAM Identity Center bootstrap.
#
# This root runs once and covers all account assignments (dev, staging, prod).
# It is a one-shot bootstrap domain — never applied automatically on push.
#
# Trigger model:
#   workflow_dispatch → plan or apply (operator-triggered, explicit action choice)
#                       apply requires manual approval via GitHub Environment "org"
#   pull_request targeting main → plan + comment on PR (no apply)
#
# Role separation:
#   plan  → AWS_ORG_TERRAFORM_PLAN_ROLE_ARN  (read-only)
#   apply → AWS_ORG_TERRAFORM_APPLY_ROLE_ARN (write, gated by "org" environment)

name: terraform · domains/organization

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply — apply modifies IAM Identity Center for ALL environments"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
  pull_request:
    branches: [main]
    paths:
      - "terraform/domains/organization/**"
      - "terraform/_core/modules/aws/identity-center-bootstrap/**"
      - "terraform/_core/modules/aws/identity-center-assignment/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-west-3"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/domains/organization/

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.60.0

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init --config $GITHUB_WORKSPACE/terraform/_ci/.tflint.hcl
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: |
          tflint --config $GITHUB_WORKSPACE/terraform/_ci/.tflint.hcl \
                 --chdir terraform/domains/organization

  plan-or-apply:
    name: plan-or-apply · organization
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') && 'org' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: resolve action
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "action=plan" >> "$GITHUB_OUTPUT"
          else
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            ${{ steps.resolve.outputs.action == 'apply'
                && secrets.AWS_ORG_TERRAFORM_APPLY_ROLE_ARN
                || secrets.AWS_ORG_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform/domains/organization
        run: terraform init -no-color

      - name: terraform validate
        working-directory: terraform/domains/organization
        run: terraform validate -no-color

      - name: terraform plan
        if: steps.resolve.outputs.action == 'plan'
        id: plan
        working-directory: terraform/domains/organization
        run: terraform plan -no-color -out=tfplan

      - name: post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### terraform plan · domains/organization
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: terraform apply
        if: steps.resolve.outputs.action == 'apply'
        working-directory: terraform/domains/organization
        run: terraform apply -auto-approve -no-color
