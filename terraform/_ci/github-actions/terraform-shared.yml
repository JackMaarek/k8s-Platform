# terraform-shared.yml
# CI pipeline for _core/shared — VPC, EKS, IAM, GitHub OIDC.
#
# Trigger model (env-branch):
#   push on dev/staging/prod → plan + apply for that env
#   pull_request targeting dev/staging/prod → plan + comment on PR
#
# Apply requires GitHub Environment approval for staging and prod.

name: terraform · core/shared

on:
  push:
    branches: [dev, staging, prod]
    paths:
      - "terraform/_core/shared/**"
      - "terraform/_core/modules/**"
  pull_request:
    branches: [dev, staging, prod]
    paths:
      - "terraform/_core/shared/**"
      - "terraform/_core/modules/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-west-3"

jobs:
  # ── Resolve the target env from the branch name ────────────────────────────
  # push on dev → env=dev, pull_request targeting staging → env=staging, etc.
  resolve-env:
    name: resolve env
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - id: resolve
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "env=${BRANCH}" >> "$GITHUB_OUTPUT"

  # ── Lint — always run on any change ───────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: resolve-env
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/_core/

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.60.0

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: |
          tflint --config $GITHUB_WORKSPACE/terraform/_ci/.tflint.hcl \
                 --chdir terraform/_core/shared/${{ needs.resolve-env.outputs.env }}

  # ── Plan — run on push and pull_request ────────────────────────────────────
  plan:
    name: plan · ${{ needs.resolve-env.outputs.env }}
    runs-on: ubuntu-latest
    needs: [resolve-env, lint]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform/_core/shared/${{ needs.resolve-env.outputs.env }}
        run: terraform init -no-color

      - name: terraform validate
        working-directory: terraform/_core/shared/${{ needs.resolve-env.outputs.env }}
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        working-directory: terraform/_core/shared/${{ needs.resolve-env.outputs.env }}
        run: terraform plan -no-color -out=tfplan

      - name: post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### terraform plan · core/shared/${{ needs.resolve-env.outputs.env }}
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ── Apply — only on direct push to env branch (not on PR) ─────────────────
  # staging and prod require manual approval via GitHub Environments.
  apply:
    name: apply · ${{ needs.resolve-env.outputs.env }}
    runs-on: ubuntu-latest
    needs: [resolve-env, plan]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform/_core/shared/${{ needs.resolve-env.outputs.env }}
        run: terraform init -no-color

      - name: terraform apply
        working-directory: terraform/_core/shared/${{ needs.resolve-env.outputs.env }}
        run: terraform apply -auto-approve -no-color
