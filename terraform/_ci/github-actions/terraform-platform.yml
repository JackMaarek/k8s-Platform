# terraform-platform.yml
# CI pipeline for domains/platform — node groups, IRSA.
#
# Trigger model (env-branch):
#   push on dev/staging/prod → plan + apply for that env
#   pull_request targeting dev/staging/prod → plan + comment on PR
#
# Apply requires GitHub Environment approval for staging and prod.

name: terraform · domains/platform

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        default: dev
  push:
    branches: [dev, staging, prod]
    paths:
      - "terraform/domains/platform/**"
      - "terraform/_core/modules/**"
  pull_request:
    branches: [dev, staging, prod]
    paths:
      - "terraform/domains/platform/**"
      - "terraform/_core/modules/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-west-3"

jobs:
  resolve-env:
    name: resolve env
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.head_ref || github.ref_name }}"
            echo "env=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: resolve-env
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/domains/

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.60.0

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init --config $GITHUB_WORKSPACE/terraform/_ci/.tflint.hcl
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: |
          tflint --config $GITHUB_WORKSPACE/terraform/_ci/.tflint.hcl \
                 --chdir terraform/domains/platform/${{ needs.resolve-env.outputs.env }}

  plan:
    name: plan · ${{ needs.resolve-env.outputs.env }}
    runs-on: ubuntu-latest
    needs: [resolve-env, lint]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform/domains/platform/${{ needs.resolve-env.outputs.env }}
        run: terraform init -no-color

      - name: terraform validate
        working-directory: terraform/domains/platform/${{ needs.resolve-env.outputs.env }}
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        working-directory: terraform/domains/platform/${{ needs.resolve-env.outputs.env }}
        run: terraform plan -no-color -out=tfplan

      - name: post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### terraform plan · domains/platform/${{ needs.resolve-env.outputs.env }}
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply:
    name: apply · ${{ needs.resolve-env.outputs.env }}
    runs-on: ubuntu-latest
    needs: [resolve-env, plan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.resolve-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform/domains/platform/${{ needs.resolve-env.outputs.env }}
        run: terraform init -no-color

      - name: terraform apply
        working-directory: terraform/domains/platform/${{ needs.resolve-env.outputs.env }}
        run: terraform apply -auto-approve -no-color
